name: Monorepo CI Pipeline

on:
    # Dispara automaticamente ao enviar novos commits para a branch main
    push:
        branches:
            - main
    # Dispara na abertura ou atualização de Pull Requests direcionados para a branch main
    pull_request:
        branches:
            - main
    # Permite execução manual pelo painel web do Github Actions
    workflow_dispatch:

# Permite cancelar execuções anteriores na mesma branch se onovos commits forem enviados
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Job 1: Validação Estáticas e Testes Rápidos ()
    validacoes-e-testes:
        name: 1. Qualidade, Tipos e Testes Unitários
        runs-on: ubuntu-latest

        steps:
            - name: 1. Baixar o código-fonte
             uses: actions/checkout@v4

            - name: 2. Habilitar o pnpm
             uses: pnpm/actions-setup@v4
             with:
                version: 11

            - name: 3. Configurar o Node.js 24
             uses: actions/setup-node@v4
             with:
                node-version: 24
            
            - name: 4. Instalar Dependências do Backend
             run: |
              cd backend
              pnpm install --frozen-lockfile

            - name: 5. Validar Padronização de codigo (ESLint)
             run: |
              cd backend
              pnpm run lint

            - name: 6. Validar formatação de arquivos (Prettier)
             run: |
              cd backend
              pnpm run format:check

            - name: 7. Checagem de Tipos no backend (tsc --noEmit)
             run: |
              cd backend
              pnpm run type-check

              